<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="998px" preserveAspectRatio="none" style="width:865px;height:998px;background:#FFFFFF;" version="1.1" viewBox="0 0 865 998" width="865px" zoomAndPan="magnify"><title>SendPermit &#8212; dual-terminal AND-join (packed AtomicInteger)</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="451.3975" x="199.8815" y="23.5352">SendPermit &#8212; dual-terminal AND-join (packed AtomicInteger)</text></g><path d="M19.5,44.4883 L495.6728,44.4883 A12.5,12.5 0 0 1 508.1728,56.9883 L508.1728,70.9766 L7,70.9766 L7,56.9883 A12.5,12.5 0 0 1 19.5,44.4883" fill="#F1F1F1"/><rect fill="none" height="591.4883" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="501.1728" x="7" y="44.4883"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="508.1728" y1="70.9766" y2="70.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="223.1182" x="146.0273" y="63.0234">SendPermit.state : AtomicInteger</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="174.958" x="123.97" y="138.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="164.958" x="128.97" y="164.2676">backend: NOT_STARTED</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="137.8867" x="22.51" y="246.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.8867" x="27.51" y="272.2676">backend: STARTED</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="144.9072" x="19" y="354.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.9072" x="24" y="380.2676">backend: TERMINAL</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="130.3193" x="267.29" y="246.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120.3193" x="272.29" y="272.2676">backend: SKIPPED</text><g class="start_entity" data-qualified-name="PERMIT..start.PERMIT" data-source-line="10" id="ent0002"><ellipse cx="211.45" cy="91.9766" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><!--link *start*PERMIT to NOT_STARTED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="10" id="lnk3"><path d="M211.45,102.2866 C211.45,111.6966 211.45,120.5166 211.45,132.4966" fill="none" id="*start*PERMIT-to-NOT_STARTED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="211.45,138.4966,215.45,129.4966,211.45,133.4966,207.45,129.4966,211.45,138.4966" style="stroke:#181818;stroke-width:1;"/></g><!--link NOT_STARTED to STARTED--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="11" id="lnk4"><path d="M123.55,173.1366 C111.43,178.6466 100.42,186.3166 92.45,196.9766 C81.91,211.0866 81.9776,225.8502 84.9476,240.8902" fill="none" id="NOT_STARTED-to-STARTED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="86.11,246.7766,88.2906,237.1721,85.1413,241.8713,80.4422,238.722,86.11,246.7766" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.8765" x="117.7139" y="210.5449">backendStarted() CAS wins</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.4043" x="93.45" y="225.8555">(worker thread, before Broker call)</text></g><!--link STARTED to B_TERMINAL--><g class="link" data-entity-1="en