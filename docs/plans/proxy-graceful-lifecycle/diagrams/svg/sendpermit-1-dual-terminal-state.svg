75,169.1537,383.4377,172.5735,378.9316,164.2,384.1166" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.7178" x="187.91" y="380.0449">re-entry is an idempotent no-op</text></g><line style="stroke:#181818;stroke-width:1.5;stroke-dasharray:8,10;" x1="12" x2="501.1728" y1="399.9766" y2="399.9766"/><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="112.1973" x="35.15" y="462.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="102.1973" x="40.15" y="488.2676">protocol: OPEN</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="144.5039" x="19" y="585.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.5039" x="24" y="611.2676">protocol: TERMINAL</text><g class="start_entity" data-qualified-name="PERMIT.CONC2..start.CONC2" data-source-line="19" id="ent0008"><ellipse cx="91.25" cy="415.9766" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><!--link *start*CONC2 to OPEN--><g class="link" data-entity-1="ent0008" data-entity-2="ent0008" data-link-type="dependency" data-source-line="19" id="lnk9"><path d="M91.25,426.2866 C91.25,435.6966 91.25,444.5166 91.25,456.4966" fill="none" id="*start*CONC2-to-OPEN" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="91.25,462.4966,95.25,453.4966,91.25,457.4966,87.25,453.4966,91.25,462.4966" style="stroke:#181818;stroke-width:1;"/></g><!--link OPEN to P_TERMINAL--><g class="link" data-entity-1="ent0008" data-entity-2="ent0009" data-link-type="dependency" data-source-line="20" id="lnk10"><path d="M91.25,503.4166 C91.25,525.9966 91.25,557.0266 91.25,579.5866" fill="none" id="OPEN-to-P_TERMINAL" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="91.25,585.5866,95.25,576.5866,91.25,580.5866,87.25,576.5866,91.25,585.5866" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.75" x="92.25" y="534.5449">protocolTerminal(result)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.707" x="101.7715" y="549.8555">gRPC streamClosed /</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.1279" x="92.561" y="565.166">Remoting write terminal</text></g><!--link P_TERMINAL to P_TERMINAL--><g class="link" data-entity-1="ent0009" data-entity-2="ent0009" data-link-type="dependency" data-source-line="21" id="lnk11"><path d="M163.84,595.5666 C174.39,597.2266 181.5,600.6866 181.5,605.9766 C181.5,611.2666 180.3171,613.794 169.7671,615.454" fill="none" id="P_TERMINAL-to-P_TERMINAL" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="163.84,616.3866,173.3524,618.939,168.7792,615.6094,172.1089,611.0363,163.84,616.3866" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.7178" x="187.5" y="611.0449">re-entry is an idempotent no-op</text></g><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="126.1084" x="194.53" y="742.9783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.1084" x="199.53" y="768.2693">RELEASED  (bit 3)</text><g class="entity" data-qualified-name="REGIONS" data-source-line="31" id="ent0011"><path d="M543.01,273.9883 L543.01,406.4727 L858.1604,406.4727 L858.1604,283.9883 L848.1604,273.9883 L543.01,273.9883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M848.1604,273.9883 L848.1604,283.9883 L858.1604,283.9883 L848.1604,273.9883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="103.6255" x="549.01" y="291.5566">backend region</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.4116" x="656.7488" y="291.5566">&#8212; "did the Broker call finish?"</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.147" x="549.01" y="306.8672">STARTED can only leave via the real Broker</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.1987" x="549.01" y="322.1777">future. It must never be short-circuited to</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.7002" x="549.01" y="337.4883">SKIPPED or a synthetic terminal.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="549.01" y="352.7988">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="103.3018" x="549.01" y="368.1094">protocol region</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.9092" x="656.425" y="368.1094">&#8212; "did the client-facing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.4116" x="549.01" y="383.4199">stream finish?" Written once, by the transport,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.1895" x="549.01" y="398.7305">from the tracer's streamClosed.</text></g><g class="end_entity" data-qualified-name=".end." data-source-line="28" id="ent0013"><ellipse cx="140.59" cy="940.9083" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="140.59" cy="940.9083" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="42" id="ent0003"><path d="M238.67,889.9783 L238.67,991.8416 L510.5103,991.8416 L510.5103,899.9783 L500.5103,889.9783 L238.67,889.9783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M500.5103,889.9783 L500.5103,899.9783 L510.5103,899.9783 L500.5103,889.9783" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.8403" x="244.67" y="907.5466">The two regions advance independently</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.4253" x="244.67" y="922.8572">and in any order. Only the AND of both</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.7969" x="244.67" y="938.1677">releases the permit, and only the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.2441" x="244.67" y="953.4783">winning CAS decrements the gate &#8212; so</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.7563" x="244.67" y="968.7888">the gate count can never be double-</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.2949" x="244.67" y="984.0994">decremented nor leaked.</text></g><!--link PERMIT to RELEASED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0010" data-link-type="dependency" data-source-line="26" id="lnk12"><path d="M257.59,636.3083 C257.59,681.7083 257.59,714.7883 257.59,736.8383" fill="none" id="PERMIT-to-RELEASED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="257.59,742.8383,261.59,733.8383,257.59,737.8383,253.59,733.8383,257.59,742.8383" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.1611" x="281.0924" y="679.5466">maybeRelease() CAS wins</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.166" x="258.59" y="694.8572">backend in {TERMINAL, SKIPPED}</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.9883" x="271.6789" y="710.1677">AND protocol == TERMINAL</text></g><!--link RELEASED to *end*--><g class="link" data-entity-1="ent0010" data-entity-2="ent0013" data-link-type="dependency" data-source-line="28" id="lnk14"><path d="M194.08,774.9483 C172.46,782.0483 150.51,793.7383 137.59,812.9783 C112.76,849.9383 126.9952,901.9361 134.9452,924.6161" fill="none" id="RELEASED-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="136.93,930.2783,137.7277,920.4618,135.276,925.5598,130.178,923.1081,136.93,930.2783" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.5889" x="194.7096" y="826.5466">onRelease.run()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.8281" x="138.59" y="841.8572">-&gt; SendDrainGate accepted -= 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.9248" x="161.0417" y="857.1677">completion.complete(null)</text></g><!--link RELEASED to GMN2--><g class="link" data-entity-1="ent0010" data-entity-2="ent0003" data-link-type="association" data-source-line="42" id="lnk4"><path d="M315.63,783.3383 C329.65,790.5883 343.25,800.2583 352.59,812.9783 C368.66,834.8783 374.44,864.5883 376.06,889.7483" fill="none" id="RELEASED-GMN2" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><?plantuml-src bLHDRzf04BtxLuou52fCLFM6abGaGH5gIYn0wg5KqNezm3RshhMxJeIYIFqH_ONz9Ptn5wObXvxmBZDlthnvirxv5A6tH9r4Q3FbuVVFNv0K8WqzdxL8OJA_2NyOfQ6V2_c82KoyoPISQOzRj8DUi5C90cQvtqE2JbgLUsLq43Wl_17ugBeP7oFqG3Y8feilinMy101rMip5T3A6-VtgORcQB5RJcpAqSpuHtOryEsh5vUQJkpBiwg4vdiBxF8kY1g_w3YZis_ll48QN