  <text x="117.76499999999987" y="920" font-size="11.0" fill="#92400e">A second GO_AWAY on the replayed attempt WOULD fail the client -</text>
  <text x="117.76499999999987" y="935" font-size="11.0" fill="#92400e">this path buffers exactly one migration, never correctness.</text>
  <path d="M 354.81500000000005,961 H 758.185 L 770.185,973 V 1022 H 354.81500000000005 Z" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
