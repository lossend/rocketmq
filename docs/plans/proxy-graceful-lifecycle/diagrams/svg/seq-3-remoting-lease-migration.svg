  <text x="368.81500000000005" y="982" font-size="11.0" fill="#92400e">Idle channel with zero inflight and expired lease is closed directly.</text>
  <text x="368.81500000000005" y="997" font-size="11.0" fill="#92400e">Legacy clients (&lt;= V5_2_0) get SERVE_UNTIL_CUTOFF: no GO_AWAY</text>
  <text x="368.81500000000005" y="1012" font-size="11.0" fill="#92400e">capability, served until forced close.</text>
