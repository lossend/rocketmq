  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <rect width="1270" height="1277" fill="#ffffff"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#111827">Direct SIGTERM preempts PreStop</text>
  <text x="30" y="62" font-size="12.5" fill="#6b7280">spec §8.3  ·  TERM fast-forwards the state machine instead of waiting for lbCutoff / migrationCutoff</text>
  <line x1="30" y1="74" x2="1240" y2="74" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="24" y="779" width="1222" height="175" rx="6" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="110.5" y1="146" x2="110.5" y2="1197" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5,4"/>
  <line x1="390.5" y1="146" x2="390.5" y2="1197" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5,4"/>
  <line x1="780.5" y1="146" x2="780.5" y2="1197" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5,4"/>
  <line x1="990.5" y1="146" x2="990.5" y2="1197" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5,4"/>
  <line x1="1170.5" y1="146" x2="1170.5" y2="1197" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5,4"/>
  <line x1="24" y1="852" x2="1246" y2="852" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,4"/>
  <rect x="34" y="854" width="173.37500000000006" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="120.68750000000003" y="866.5" font-size="11" font-weight="600" text-anchor="middle" fill="#475569">else  stopDeadline exceeded</text>
  <rect x="24" y="779" width="200.76500000000004" height="19" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="124.38250000000002" y="792.5" font-size="11" font-weight="600" text-anchor="middle" fill="#475569">alt  drained before stopDeadline</text>
  <line x1="114.5" y1="195" x2="390.5" y2="195" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar-req)"/>
  <rect x="155.97249999999997" y="174" width="189.05500000000004" height="17" fill="#ffffff"/>
  <text x="250.5" y="186" font-size="11.5" text-anchor="middle" fill="#334155">shutdown(SIGTERM_FALLBACK)</text>
  <line x1="394.5" y1="243" x2="780.5" y2="243" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar-req)"/>
  <rect x="480.30625" y="209" width="210.3875000000001" height="30" fill="#ffffff"/>
  <text x="585.5" y="221" font-size="11.5" text-anchor="middle" fill="#334155">beginDrain(SIGTERM_FALLBACK)</text>
  <text x="585.5" y="234" font-size="11.5" text-anchor="middle" fill="#334155">(join existing DrainRun if present)</text>
  <line x1="776.5" y1="278" x2="390.5" y2="278" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ar-ret)"/>
  <rect x="489.47749999999996" y="257" width="192.04500000000007" height="17" fill="#ffffff"/>
  <text x="585.5" y="269" font-size="11.5" text-anchor="middle" fill="#334155">DrainRun (session, drainFuture)</text>
  <rect x="270.02000000000004" y="294" width="240.95999999999995" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="270.02000000000004" y="294" width="3.5" height="44" rx="1.5" fill="#9ca3af"/>
  <text x="392.5" y="313" font-size="12.0" text-anchor="middle" fill="#374151">CAS AtomicReference&lt;StopRun&gt;</text>
  <text x="392.5" y="328" font-size="12.0" text-anchor="middle" fill="#374151">(first winner constructs StopRun)</text>
  <rect x="265.49" y="354" width="250.01999999999995" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="265.49" y="354" width="3.5" height="44" rx="1.5" fill="#9ca3af"/>
  <text x="392.5" y="373" font-size="12.0" text-anchor="middle" fill="#374151">stopDeadline = min(now+jvmTimeout,</text>
  <text x="392.5" y="388" font-size="12.0" text-anchor="middle" fill="#374151">(preStopDeadline+jvmTimeout)-now)</text>
  <line x1="394.5" y1="433" x2="780.5" y2="433" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar-req)"/>
  <rect x="494.39374999999995" y="412" width="182.21250000000003" height="17" fill="#ffffff"/>
  <text x="585.5" y="424" font-size="11.5" text-anchor="middle" fill="#334155">escalateForStop(stopDeadline)</text>
  <rect x="634.7900000000001" y="449" width="291.4199999999999" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="634.7900000000001" y="449" width="3.5" height="44" rx="1.5" fill="#9ca3af"/>
  <text x="782.5" y="468" font-size="12.0" text-anchor="middle" fill="#374151">cancel pending lb / lease scheduled timers</text>
  <text x="782.5" y="483" font-size="12.0" text-anchor="middle" fill="#374151">(phase generation)</text>
  <rect x="630.86" y="509" width="299.2799999999999" height="59" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="630.86" y="509" width="3.5" height="59" rx="1.5" fill="#9ca3af"/>
  <text x="782.5" y="528" font-size="12.0" text-anchor="middle" fill="#374151">fast-forward state machine</text>
  <text x="782.5" y="543" font-size="12.0" text-anchor="middle" fill="#374151">(READY/QUIESCING/MIGRATING -&gt; DRAINING,</text>
  <text x="782.5" y="558" font-size="12.0" text-anchor="middle" fill="#374151">or STARTING -&gt; FORCE_DRAINING)</text>
  <line x1="784.5" y1="616" x2="1170.5" y2="616" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar-req)"/>
  <rect x="887.6424999999999" y="582" width="175.71500000000003" height="30" fill="#ffffff"/>
  <text x="975.5" y="594" font-size="11.5" text-anchor="middle" fill="#334155">closeAdmission() immediately</text>
  <text x="975.5" y="607" font-size="11.5" text-anchor="middle" fill="#334155">(no 60s / 420s wait)</text>
  <line x1="784.5" y1="664" x2="990.5" y2="664" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar-req)"/>
  <rect x="788.385" y="630" width="194.23000000000005" height="30" fill="#ffffff"/>
  <text x="885.5" y="642" font-size="11.5" text-anchor="middle" fill="#334155">freeze both protocols</text>
  <text x="885.5" y="655" font-size="11.5" text-anchor="middle" fill="#334155">(same fan-out as normal drain)</text>
  <line x1="776.5" y1="699" x2="390.5" y2="699" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ar-ret)"/>
  <rect x="433.75999999999993" y="678" width="303.48000000000013" height="17" fill="#ffffff"/>
  <text x="585.5" y="690" font-size="11.5" text-anchor="middle" fill="#334155">escalateForStop future completes (freeze issued)</text>
  <rect x="258.44000000000005" y="715" width="264.11999999999995" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="258.44000000000005" y="715" width="3.5" height="44" rx="1.5" fill="#9ca3af"/>
  <text x="392.5" y="734" font-size="12.0" text-anchor="middle" fill="#374151">await accepted_inflight_zero</text>
  <text x="392.5" y="749" font-size="12.0" text-anchor="middle" fill="#374151">within min(drainDeadline, stopDeadline)</text>
  <rect x="293.36" y="803" width="194.28000000000003" height="29" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="293.36" y="803" width="3.5" height="29" rx="1.5" fill="#9ca3af"/>
  <text x="392.5" y="822" font-size="12.0" text-anchor="middle" fill="#374151">StopRun succeeds normally</text>
  <line x1="394.5" y1="895" x2="990.5" y2="895" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar-req)"/>
  <rect x="630.7025" y="874" width="119.59499999999997" height="17" fill="#ffffff"/>
  <text x="690.5" y="886" font-size="11.5" text-anchor="middle" fill="#334155">force(stopDeadline)</text>
  <line x1="986.5" y1="930" x2="390.5" y2="930" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ar-ret)"/>
  <rect x="630.4725" y="909" width="120.05499999999999" height="17" fill="#ffffff"/>
  <text x="690.5" y="921" font-size="11.5" text-anchor="middle" fill="#334155">forced DrainResult</text>
  <rect x="179.68999999999986" y="970" width="421.6200000000003" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="179.68999999999986" y="970" width="3.5" height="44" rx="1.5" fill="#9ca3af"/>
  <text x="392.5" y="989" font-size="12.0" text-anchor="middle" fill="#374151">STOPPING -&gt; shut down Remoting -&gt; gRPC Server</text>
  <text x="392.5" y="1004" font-size="12.0" text-anchor="middle" fill="#374151">-&gt; TLS listener -&gt; EventLoopGroups -&gt; executors -&gt; STOPPED</text>
  <line x1="386.5" y1="1049" x2="110.5" y2="1049" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ar-ret)"/>
  <rect x="122.70874999999991" y="1028" width="255.58250000000018" height="17" fill="#ffffff"/>
  <text x="250.5" y="1040" font-size="11.5" text-anchor="middle" fill="#334155">stopFuture completes, hook join() returns</text>
  <rect x="50.5" y="1065" width="120" height="29" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="50.5" y="1065" width="3.5" height="29" rx="1.5" fill="#9ca3af"/>
  <text x="112.5" y="1084" font-size="12.0" text-anchor="middle" fill="#374151">JVM exits</text>
  <path d="M 429.6574999999998,1110 H 939.3425000000002 L 951.3425000000002,1122 V 1171 H 429.6574999999998 Z" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
  <path d="M 939.3425000000002,1110 V 1122 H 951.3425000000002" fill="none" stroke="#eab308" stroke-width="1.2"/>
  <text x="443.6574999999998" y="1131" font-size="11.0" fill="#92400e">If TERM bypasses or interrupts an in-progress PreStop drain, it must NOT wait for</text>
  <text x="443.6574999999998" y="1146" font-size="11.0" fill="#92400e">the 60s lbCutoff or 420s migrationCutoff - it closes admission and freezes both</text>
  <text x="443.6574999999998" y="1161" font-size="11.0" fill="#92400e">protocols on the very first scheduler tick.</text>
  <rect x="30.0" y="92" width="161" height="54" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="110.5" y="115.5" font-size="13.0" font-weight="600" text-anchor="middle" fill="#111827">SIGTERM</text>
  <text x="110.5" y="132.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#6b7280">JVM shutdown hook</text>
  <rect x="320.5" y="92" width="140" height="54" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="390.5" y="124.0" font-size="13.0" font-weight="600" text-anchor="middle" fill="#111827">ProxyRuntime</text>
  <rect x="710.5" y="92" width="140" height="54" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="780.5" y="115.5" font-size="13.0" font-weight="600" text-anchor="middle" fill="#111827">ProxyLifecycle</text>
  <text x="780.5" y="132.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#6b7280">Coordinator</text>
  <rect x="920.5" y="92" width="140" height="54" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="990.5" y="115.5" font-size="13.0" font-weight="600" text-anchor="middle" fill="#111827">Grpc / Remoting</text>
  <text x="990.5" y="132.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#6b7280">DrainAdapter</text>
  <rect x="1100.5" y="92" width="140" height="54" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="1170.5" y="124.0" font-size="13.0" font-weight="600" text-anchor="middle" fill="#111827">SendDrainGate</text>
