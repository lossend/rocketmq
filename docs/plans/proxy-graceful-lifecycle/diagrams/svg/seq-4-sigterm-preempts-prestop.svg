      <polygon points="0 0, 9 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="ar-ret" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9333ea"/>
