y counted this send (accepted += 1) and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.9126" x="182.2253" y="153.6543">the permit is bound to the holder.</text><g class="message" data-entity-1="part1" data-entity-2="part5" id="msg1"><polygon fill="#181818" points="1074.1719,183.707,1084.1719,187.707,1074.1719,191.707,1078.1719,187.707" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="63.167" x2="1080.1719" y1="187.707" y2="187.707"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="70.167" y="182.9648">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.3403" x="82.7427" y="182.9648">sendMessage(request)</text></g><g class="message" data-entity-1="part5" data-entity-2="part5" id="msg2"><line style="stroke:#181818;stroke-width:1;" x1="1096.1719" x2="1138.1719" y1="232.3281" y2="232.3281"/><line style="stroke:#181818;stroke-width:1;" x1="1138.1719" x2="1138.1719" y1="232.3281" y2="245.3281"/><line style="stroke:#181818;stroke-width:1;" x1="1097.1719" x2="1138.1719" y1="245.3281" y2="245.3281"/><polygon fill="#181818" points="1107.1719,241.3281,1097.1719,245.3281,1107.1719,249.3281,1103.1719,245.3281" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="1103.1719" y="219.9307">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.5962" x="1115.7476" y="212.2754">requestPipeline.execute()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.9932" x="1115.7476" y="227.5859">permit copied onto ProxyContext</text></g><g class="message" data-entity-1="part5" data-entity-2="part5" id="msg3"><line style="stroke:#181818;stroke-width:1;" x1="1096.1719" x2="1138.1719" y1="289.9492" y2="289.9492"/><line style="stroke:#181818;stroke-width:1;" x1="1138.1719" x2="1138.1719" y1="289.9492" y2="302.9492"/><line style="stroke:#181818;stroke-width:1;" x1="1097.1719" x2="1138.1719" y1="302.9492" y2="302.9492"/><polygon fill="#181818" points="1107.1719,298.9492,1097.1719,302.9492,1107.1719,306.9492,1103.1719,302.9492" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.5757" x="1103.1719" y="277.5518">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.3242" x="1115.7476" y="269.8965">validateContext() throws</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.2886" x="1115.7476" y="285.207">(e.g. CLIENT_ID_REQUIRED)</text></g><path d="M1101,315.9492 L1101,370.9492 L1379,370.9492 L1379,325.9492 L1369,315.9492 L1101,315.9492" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1369,315.9492 L1369,325.9492 L1379,325.9492 L1369,315.9492" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.3213" x="1107" y="333.5176">Thrown BEFORE executor.submit(), so no</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.6509" x="1107" y="348.8281">worker thread ever runs. Nobody will</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.4419" x="1107" y="364.1387">ever call backendStarted().</text><g class="message" data-entity-1="part5" data-entity-2="part4" id="msg4"><polygon fill="#181818" points="679.938,394.1914,669.938,398.1914,679.938,402.1914,675.938,398.1914" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="673.938" x2="1085.1719" y1="398.1914" 